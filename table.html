<!DOCTYPE html>
<html>
    <head>
        <title>Table in html</title>
    </head>
    <body>
        <!-- tr = table row
            th = table head(center aligned and bold)
            td = table data-->
        <table border="">
            <tr>
                <th>Monday</th>
                <td>Maths</td>
                <td>Physics</td>
                <td>Biology</td>
            </tr>
            
            <tr>
                <th>Tuesday</th>
                <td>Chemistry</td>
                <td>Biology</td>
                <td>Chemistry</td>
            </tr>

            <tr>
                <th>Wednesday</th>
                <td>Physics</td>
                <td>PHE</td>
                <td>Civic</td>
            </tr>

            <tr>
                <th>Thursday</th>
                <td>CRS</td>
                <td>Biology</td>
                <td>Chem. Lab</td>
            </tr>

            <tr>
                <th>Friday</th>
                <td>Social Studies</td>
                <td>Civic</td>
                <td>English</td>
            </tr>
        </table>
    </body>
</html>
